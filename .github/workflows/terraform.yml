name: Terraform Multi-Env Pipeline

on:
  pull_request:
  push:
    branches: ["dev", "staging", "release"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

#######################################
# 🔍 PR VALIDATION (NO AWS ACCESS)
#######################################
jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dry run)
        run: terraform plan -lock=false

      - name: Run TFLint
        uses: terraform-linters/tflint-action@v4

      - name: Run tfsec Security Scan
        uses: aquasecurity/tfsec-action@v1.0.3


#######################################
# 🟢 DEV DEPLOY (AUTO APPLY)
#######################################
  dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    environment: dev

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: dev-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: environments/dev/tfplan

      - name: Terraform Apply (Auto)
        run: terraform apply -auto-approve tfplan


#######################################
# 🟡 STAGING DEPLOY (APPROVAL REQUIRED)
#######################################
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/staging

    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: staging-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-tfplan
          path: environments/staging/tfplan

      - name: Terraform Apply (After Approval)
        run: terraform apply -auto-approve tfplan


#######################################
# 🔴 PRODUCTION DEPLOY (STRICT CONTROL)
#######################################
  prod:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: prod-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: environments/prod/tfplan

      - name: Terraform Apply (After Approval)
        run: terraform apply -auto-approve tfplan