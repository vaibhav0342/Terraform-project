name: Terraform Multi-Env Pipeline

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================
  # DEV STAGE
  # =========================
  dev:
    name: Deploy Dev
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/dev-role
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: Apply Dev
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

  # =========================
  # STAGING STAGE
  # =========================
  staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: dev   # only runs after dev success

    defaults:
      run:
        working-directory: environments/staging

    environment: staging   # requires approval

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/staging-role
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: Apply Staging
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan

  # =========================
  # PROD STAGE
  # =========================
  prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: staging

    defaults:
      run:
        working-directory: environments/prod

    environment: production   # strict approval

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/prod-role
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan

      - name: Apply Production
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan