name: Terraform Multi-Env Pipeline

on:
  push:
    branches: ["dev", "staging", "release"]
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true
  AWS_REGION: ${{ secrets.AWS_REGION }}

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

#######################################
# 🔍 PR VALIDATION (NO AWS ACCESS)
#######################################
jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format Check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Plan (dry run)
        run: terraform plan -lock=false

#######################################
# 🟢 DEV (AUTO APPLY)
#######################################
  dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    environment: dev

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init
        run: terraform init


      - name: Plan
        run: terraform plan -out=tfplan

      - name: Apply / Destroy
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve tfplan
          fi

      - name: Terraform Apply (AUTO)
        run: terraform apply -auto-approve -input=false tfplan

#######################################
# 🟡 STAGING (APPROVAL REQUIRED)
#######################################
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/staging

    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: staging-plan
          path: environments/staging/tfplan

      - name: Apply / Destroy
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve tfplan
          fi

#######################################
# 🔴 PRODUCTION (STRICT CONTROL)
#######################################
  prod:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          path: environments/prod/tfplan

      - name: Apply / Destroy
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve
          else
            terraform apply -auto-approve tfplan
          fi
