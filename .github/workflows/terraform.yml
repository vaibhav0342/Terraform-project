name: Terraform Enterprise Multi-Env Pipeline

on:
  pull_request:
  push:
    branches: ["dev", "staging", "release"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_INPUT: 0
  TF_IN_AUTOMATION: true

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

#######################################
# 🔍 PR VALIDATION (SECURE - NO AWS)
#######################################
jobs:
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init (safe mode)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (safe dry-run)
        run: terraform plan -lock=false -input=false

      - name: Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Lint (tflint)
        uses: terraform-linters/tflint-action@v4


#######################################
# 🟢 DEV (AUTO APPLY - FAST FEEDBACK)
#######################################
  dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    environment: dev

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: dev-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-plan
          path: environments/dev/tfplan

      - name: Terraform Apply (AUTO)
        run: terraform apply -auto-approve -input=false tfplan


#######################################
# 🟡 STAGING (APPROVAL REQUIRED)
#######################################
  staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/staging

    environment: staging

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: staging-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-plan
          path: environments/staging/tfplan

      - name: Terraform Apply (Manual Approval)
        run: terraform apply -auto-approve -input=false tfplan


#######################################
# 🔴 PRODUCTION (HARD GATED)
#######################################
  prod:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/prod

    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: AWS Auth (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PROD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: prod-${{ github.run_id }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          path: environments/prod/tfplan

      - name: Terraform Apply (STRICT APPROVAL)
        run: terraform apply -auto-approve -input=false tfplan